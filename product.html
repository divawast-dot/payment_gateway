<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a Vendor - Dr. Tracker Bharat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="product">
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="index.html" class="logo">Dr. Tracker Bharat</a>
        <p class="tagline">Health &amp; Supplements Marketplace</p>
      </div>
      <div class="header-icons">
        <a href="wishlist.html" class="wishlist-icon-link" aria-label="View wishlist">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="cart-badge wishlist-badge" hidden>0</span>
        </a>
        <a href="cart.html" class="cart-icon-link" aria-label="View cart">
          <svg class="cart-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <a href="index.html" class="back-link">&larr; Back to products</a>

    <section id="product-detail" class="product-detail">
      <!-- Product name + one-line description injected by script.js -->
    </section>

    <section class="vendor-section">
      <h3>Choose a vendor</h3>
      <div id="vendor-list" class="vendor-list">
        <!-- Vendor options injected by script.js -->
      </div>
    </section>

    <div class="continue-bar">
      <p id="selection-summary" class="selection-summary">Select a vendor to continue</p>
      <button id="continue-btn" class="btn btn-primary" disabled>Continue</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
