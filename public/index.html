<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. Tracker Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <button type="button" class="logo" id="logo-btn">Dr. Tracker</button>
      </div>
      <div class="header-icons">
        <button type="button" class="icon-btn" id="chat-toggle" aria-label="Open chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="shop-toggle" aria-label="Open shop">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cart-badge" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ---- Chat view ---- -->
    <section id="chat-view" class="view">
      <div class="chat-panel">
        <div id="messages"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" autocomplete="off" placeholder="Ask about health, or say what you want to buy..." />
          <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
        </form>
      </div>
      <p class="chat-hint">Try: "find me a vitamin c under 400" or "book a dietician for Wednesday" or "apply DRTRACKER10"</p>
    </section>

    <!-- ---- Shop view ---- -->
    <section id="shop-view" class="view hidden">
      <div class="shop-topbar">
        <div>
          <h2 id="shop-heading" style="margin:0 0 4px;">Shop</h2>
          <p id="shop-subheading">Browse products or compare vendor prices.</p>
        </div>
        <button type="button" class="btn btn-secondary" id="back-to-chat">&larr; Back to chat</button>
      </div>

      <div id="category-tabs" class="tabs" role="tablist"></div>

      <div class="shop-layout">
        <section id="product-grid" class="product-grid"></section>

        <aside class="cart-panel">
          <h3>Your Cart</h3>
          <div id="cart-content"></div>
          <div>
            <div class="coupon-row">
              <input id="coupon-input" type="text" placeholder="Coupon code" />
              <button type="button" class="btn btn-primary btn-sm" id="coupon-apply">Apply</button>
            </div>
            <p class="coupon-hint">Try DRTRACKER10, WELCOME50, or BULK15</p>
          </div>
          <div id="cart-totals" class="cart-totals hidden">
            <div class="row"><span>Subtotal</span><span id="cart-subtotal">₹0</span></div>
            <div class="row"><span>Discount</span><span id="cart-discount">-₹0</span></div>
            <div class="row grand"><span>Total</span><span id="cart-grand-total">₹0</span></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Dr. Tracker</p>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
